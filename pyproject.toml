[project]
name = "pdf-extractext-web"
version = "0.1.0"
description = "Interfaz web y orquestador (BFF) que coordina los microservicios de pdf-extractext"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.24.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
