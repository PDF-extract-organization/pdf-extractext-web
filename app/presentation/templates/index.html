<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Summarizer</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <!-- Versiones fijas: una versión nueva no puede cambiar el renderizado sin pasar por un commit -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen overflow-hidden">
    <div class="fixed inset-0 bg-[url('/static/media/s2.png')] bg-cover bg-center bg-no-repeat">
        <div class="absolute inset-0 bg-black/60"></div>
    </div>

    <div class="fixed top-[-15rem] left-[-10rem] w-[600px] h-[600px] bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-[-15rem] right-[-10rem] w-[600px] h-[600px] bg-blue-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed top-[40%] right-[15%] w-[500px] h-[500px] bg-yellow-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative z-10 flex flex-row gap-5 h-screen p-5">
        <aside class="w-72 shrink-0 flex flex-col gap-6 bg-white/10 backdrop-blur-md rounded-2xl border border-white/10 p-6">
            <div class="flex items-center gap-3">
                <img src="/static/media/t.png" alt="PDF Summarizer logo" class="h-9 w-9 object-contain">
                <h1 class="text-2xl font-bold text-white">PDF Summarizer</h1>
            </div>
            <p class="text-sm text-white/60">Extract and summarize your PDFs with AI</p>

            <div class="flex-1 flex flex-col items-center justify-center gap-4 border-2 border-dashed border-white/20 hover:border-white transition-colors duration-200 rounded-xl p-6 text-center group bg-white/5" id="upload-area">
                <form id="upload-form" class="w-full space-y-4 flex flex-col items-center">
                    <svg class="h-12 w-12 text-white/40 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33A3 3 0 0116.5 19.5H6.75z" />
                    </svg>
                    <label class="inline-block px-6 py-3 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold rounded-lg cursor-pointer transition-all duration-200 hover:ring-2 hover:ring-white/50 active:translate-y-0" for="pdf-input">
                        <input type="file" id="pdf-input" accept=".pdf" class="hidden">
                        <span>Choose PDF File</span>
                    </label>
                    <p id="file-name" class="text-sm text-white/50 font-medium">No file selected</p>
                    <button type="submit" id="submit-btn" disabled class="w-full px-8 py-3 bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-700 hover:to-emerald-800 text-white font-semibold rounded-lg transition-all duration-200 hover:ring-2 hover:ring-white/50 active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:ring-0">
                        Generate Summary
                    </button>
                </form>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-white/10 backdrop-blur-md rounded-2xl border border-white/10 p-6 overflow-hidden relative">
            <div class="flex items-start justify-between mb-4 shrink-0">
                <div>
                    <h2 class="text-xl font-bold text-white">Resumen:</h2>
                    <p id="result-title" class="text-sm text-white/50 mt-0.5"></p>
                </div>
                <button id="result-close" class="p-1.5 rounded-full hover:bg-white/20 transition-colors text-white/60 hover:text-white" aria-label="Close summary">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto scrollbar-thin" id="result-scroll">
                <div id="result-placeholder" class="flex items-center justify-center h-full text-white/30 text-sm">
                    Upload a PDF and generate a summary to see results here
                </div>
                <div id="result-container" style="display: none;">
                    <div id="result-content" class="prose prose-invert max-w-none text-base leading-relaxed text-white/80 break-words"></div>
                </div>
                <div id="error-container" style="display: none;" class="bg-red-500/10 border-l-4 border-red-500 rounded-lg p-4">
                    <div class="flex items-start gap-3">
                        <svg class="h-5 w-5 text-red-400 shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                        </svg>
                        <p id="error-message" class="text-sm text-red-200 font-medium"></p>
                    </div>
                </div>
            </div>

            <button id="download-btn" class="mt-4 self-start flex items-center gap-2 px-4 py-2 rounded-lg bg-blue-600/20 hover:bg-blue-600/40 border border-blue-500/30 hover:border-blue-400/60 transition-all duration-200 text-blue-300 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed text-sm font-medium" disabled aria-label="Download summary as DOCX">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                Exportar
            </button>
        </main>

        <div class="flex items-start shrink-0">
            <button id="sidebar-toggle" aria-expanded="true" aria-label="Toggle document history" class="shrink-0 mt-6 p-2 bg-white/10 backdrop-blur-md rounded-full text-white hover:bg-white/20 transition-all duration-200 z-10">
                <svg class="h-4 w-4 transition-transform duration-300" id="toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <aside id="history-sidebar" class="w-64 p-6 bg-white/10 backdrop-blur-md rounded-2xl border border-white/10 overflow-hidden transition-all duration-300 ease-in-out">
                <div class="sidebar-content transition-opacity duration-200">
                    <h3 class="text-xl font-bold text-white mb-4">Mis documentos</h3>
                    <p id="history-empty" class="text-sm text-white/40">Aún no hay resúmenes.</p>
                    <div id="history-list" class="flex flex-col gap-2"></div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Plantilla de un elemento del historial: se clona y se rellena con textContent,
         así el nombre del archivo nunca se interpreta como HTML -->
    <template id="history-item-template">
        <div class="history-item flex flex-col gap-2 p-3 rounded-xl bg-white/10 border border-white/10 hover:border-white/30 transition-all duration-200 group">
            <button type="button" class="history-open flex items-center gap-3 text-left">
                <svg class="h-5 w-5 text-red-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" />
                </svg>
                <span class="history-name text-sm text-white/80 group-hover:text-white truncate transition-colors flex-1"></span>
            </button>
            <div class="flex items-center gap-3 pl-8">
                <button type="button" class="history-export p-1 text-blue-300 hover:text-white transition-colors duration-200" title="Exportar como .docx" aria-label="Exportar">
                    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>
                    </svg>
                </button>
                <button type="button" class="history-delete p-1 text-red-400 hover:text-red-300 transition-colors duration-200" title="Eliminar del historial" aria-label="Eliminar">
                    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </button>
            </div>
        </div>
    </template>

    <script>
        const fileInput = document.getElementById('pdf-input');
        const fileName = document.getElementById('file-name');
        const submitBtn = document.getElementById('submit-btn');
        const uploadForm = document.getElementById('upload-form');
        const resultContainer = document.getElementById('result-container');
        const resultContent = document.getElementById('result-content');
        const resultPlaceholder = document.getElementById('result-placeholder');
        const resultTitle = document.getElementById('result-title');
        const resultClose = document.getElementById('result-close');
        const downloadBtn = document.getElementById('download-btn');
        const errorContainer = document.getElementById('error-container');
        const errorMessage = document.getElementById('error-message');
        const historyList = document.getElementById('history-list');
        const historyEmpty = document.getElementById('history-empty');
        const historyTemplate = document.getElementById('history-item-template');

        const sidebar = document.getElementById('history-sidebar');
        const toggleBtn = document.getElementById('sidebar-toggle');
        const toggleIcon = document.getElementById('toggle-icon');

        let currentSummaryId = null;

        // --- Estado del panel de resultado ---

        // Único punto donde se pinta un resumen, venga de una subida o del historial
        function renderResult(summary) {
            currentSummaryId = summary.id;
            resultTitle.textContent = summary.original_filename;
            resultContent.innerHTML = DOMPurify.sanitize(marked.parse(summary.summary_text));
            resultPlaceholder.style.display = 'none';
            resultContainer.style.display = 'block';
            errorContainer.style.display = 'none';
            downloadBtn.disabled = false;
        }

        function renderError(message) {
            currentSummaryId = null;
            errorMessage.textContent = message;
            resultPlaceholder.style.display = 'none';
            resultContainer.style.display = 'none';
            errorContainer.style.display = 'block';
            downloadBtn.disabled = true;
        }

        function clearResult() {
            currentSummaryId = null;
            resultContainer.style.display = 'none';
            errorContainer.style.display = 'none';
            resultPlaceholder.style.display = 'flex';
            downloadBtn.disabled = true;
        }

        // El cuerpo de un error puede no ser JSON (por ejemplo, un 502 del proxy)
        async function errorDetail(response, fallback) {
            try {
                const body = await response.json();
                return body.detail || fallback;
            } catch {
                return fallback;
            }
        }

        // --- Subida ---

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                fileName.textContent = fileInput.files[0].name;
                submitBtn.disabled = false;
            }
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            resultContainer.style.display = 'none';
            errorContainer.style.display = 'none';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/summarize', { method: 'POST', body: formData });
                if (!response.ok) {
                    throw new Error(await errorDetail(response, 'No se pudo generar el resumen.'));
                }
                renderResult(await response.json());
                loadHistory();
            } catch (err) {
                renderError(err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Generate Summary';
            }
        });

        resultClose.addEventListener('click', clearResult);

        downloadBtn.addEventListener('click', () => {
            if (currentSummaryId) exportSummary(currentSummaryId);
        });

        // --- Historial ---

        function applyCollapseState(collapsed) {
            sidebar.classList.toggle('sidebar-collapsed', collapsed);
            toggleIcon.style.transform = collapsed ? 'rotate(0deg)' : 'rotate(180deg)';
            toggleBtn.setAttribute('aria-expanded', !collapsed);
            localStorage.setItem('sidebar_collapsed', collapsed);
        }

        applyCollapseState(localStorage.getItem('sidebar_collapsed') === 'true');

        toggleBtn.addEventListener('click', () => {
            applyCollapseState(!sidebar.classList.contains('sidebar-collapsed'));
        });

        function buildHistoryItem(summary) {
            const item = historyTemplate.content.firstElementChild.cloneNode(true);
            item.dataset.id = summary.id;
            item.querySelector('.history-name').textContent = summary.original_filename;
            item.querySelector('.history-open').addEventListener('click', () => showSummary(summary.id));
            item.querySelector('.history-export').addEventListener('click', () => exportSummary(summary.id));
            item.querySelector('.history-delete').addEventListener('click', () => deleteSummary(summary.id, item));
            return item;
        }

        function updateEmptyState() {
            historyEmpty.style.display = historyList.children.length === 0 ? 'block' : 'none';
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/summaries');
                if (!response.ok) throw new Error(await errorDetail(response, 'No se pudo cargar el historial.'));
                const data = await response.json();
                historyList.replaceChildren(...data.summaries.map(buildHistoryItem));
                updateEmptyState();
            } catch (err) {
                console.error('No se pudo cargar el historial:', err);
            }
        }

        async function showSummary(id) {
            try {
                const response = await fetch(`/api/summaries/${id}`);
                if (!response.ok) throw new Error(await errorDetail(response, 'No se pudo cargar el resumen.'));
                renderResult(await response.json());
            } catch (err) {
                renderError(err.message);
            }
        }

        function exportSummary(id) {
            window.location.href = `/api/summaries/${id}/export`;
        }

        async function deleteSummary(id, item) {
            try {
                const response = await fetch(`/api/summaries/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error(await errorDetail(response, 'No se pudo eliminar el resumen.'));
            } catch (err) {
                // El elemento se queda en la lista: el borrado no ocurrió
                renderError(err.message);
                return;
            }

            if (currentSummaryId === id) clearResult();
            item.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
            item.style.opacity = '0';
            item.style.transform = 'translateX(20px)';
            setTimeout(() => {
                item.remove();
                updateEmptyState();
            }, 300);
        }

        loadHistory();
    </script>
</body>
</html>
